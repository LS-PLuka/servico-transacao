name: CI — servico-transacao

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build-e-testes:
    name: Build, Testes Unitários e Integração
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes unitários e de integração
        run: mvn -B verify

      - name: Publicar relatórios de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
