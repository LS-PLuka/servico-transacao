# Todo o resto é herdado de src/main/resources/application.properties

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- RabbitMQ ----
spring.rabbitmq.listener.simple.auto-startup=false

# ---- JWT ----
jwt.secret=chave-secreta-de-testes-com-no-minimo-256-bits-para-hmac-sha256
jwt.expiration=3600000

# ---- Admin inicial ----
admin.email=admin@teste.com
admin.senha=admin123456
admin.nome=Admin Teste

# ---- Logs ----
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.springframework.amqp=WARN
